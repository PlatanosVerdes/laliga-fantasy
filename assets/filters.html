
<div class="filters">
  <label>Posición
    <select class="f-pos">
      <option value="all">todas</option>
      <option value="POR">portero</option>
      <option value="DEF">defensa</option>
      <option value="MED">medio</option>
      <option value="DEL">delantero</option>
    </select>
  </label>
  <label>Precio máximo
    <input class="f-price" type="text" inputmode="decimal" autocomplete="off" placeholder="sin límite · 20 = 20M">
  </label>
  <label>Buscar
    <input class="f-text" type="search" placeholder="nombre, equipo o dueño">
  </label>
  <button class="f-reset" type="button">Limpiar</button>
  <span class="f-count kpi-label"></span>
</div>
