<section id="once" data-tab="plantilla" class="mk mk-once">
  <div class="block"><div class="sec-head"><h2>Alineación<span class="count" id="pitch-formation"></span></h2>
    <p><span class="on-mouse">arrastra entre el campo y el banquillo</span><span class="on-touch">levanta con ⇅ y toca el hueco</span></p></div>
  <p class="pitch-best" id="pitch-best" hidden></p>
  <div class="pitch-bar">
    <label>Formación <select id="pitch-formation-select"></select></label>
    <span id="pitch-status" class="kpi-label"></span>
    <button id="pitch-reset" type="button">Descartar cambios</button>
    <button id="pitch-save" class="primary" type="button" disabled>Guardar alineación</button>
  </div>
  <p class="pitch-alert" id="pitch-alert" hidden></p>
  <div class="pitch-wrap">
    <div class="pitch" id="pitch"></div>
    <aside class="bench" id="bench">
      <h3>Banquillo</h3>
      <div class="bench-list" id="bench-list"></div>
    </aside>
  </div></div>
</section>
