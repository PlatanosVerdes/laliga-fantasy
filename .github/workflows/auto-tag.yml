name: Auto-tag (CalVer)

# On every push to main, create a date-based tag vYYYY.MM.DD.
# If several pushes land on the same day, a -N suffix is appended (v2026.07.01-1, -2, ...).
# rpi-services pins its build to these tags for reproducible deploys.

on:
  push:
    branches: [main]

permissions:
  contents: write

# One tagger at a time. Several pushes landing together each computed the same free
# number, and whoever pushed second was rejected with "reference already exists" —
# which is what happened on 2026-08-18 with v2026.08.18-24.
concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create CalVer tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Serialising the job makes a collision unlikely, not impossible: a tag can also
          # be pushed by hand between the fetch and the push. So the whole thing retries,
          # re-reading the remote each time, and only gives up after five attempts.
          for attempt in 1 2 3 4 5; do
            git fetch --tags --force --prune-tags --quiet

            # The suffix is a dot, not a dash: rpi-services picks the newest tag with
            # `sort -V`, and it reads v2026.08.18-9 as OLDER than v2026.08.18.1, so a dash
            # would silently pin the deploy to yesterday's build.
            base="v$(date +%Y.%m.%d)"
            tag="$base"
            n=1
            while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
              tag="$base.$n"
              n=$((n + 1))
            done

            git tag -a "$tag" -m "Release $tag"
            if git push origin "$tag"; then
              echo "Created tag $tag"
              exit 0
            fi

            # Somebody took the name in the meantime: drop the local tag and recompute.
            echo "El tag $tag ya existe en remoto, reintento ($attempt/5)"
            git tag -d "$tag"
            sleep $((attempt * 2))
          done

          echo "No he podido crear el tag despues de 5 intentos"
          exit 1
