name: Release

# Tags every push to main and publishes the arm64 image the Pi pulls. The steps live in
# PlatanosVerdes/workflows, shared by every app.

on:
  push:
    branches: [main]
    # Only what goes into the image is a new version.
    paths: ["cmd/**", "internal/**", "assets/**", "go.mod", "go.sum", "Dockerfile", "!**/*.md", "!**/*_test.go"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: PlatanosVerdes/workflows/.github/workflows/release.yml@main
    with:
      deploy-repo: PlatanosVerdes/rpi-services
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
